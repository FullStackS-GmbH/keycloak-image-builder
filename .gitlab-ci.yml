include:
  - local: ci/renovate.yaml
  - local: templates/build-keycloak/template.yml
    inputs:
      image_name: $CI_REGISTRY_IMAGE/test
      image_tag: $CI_COMMIT_SHA
      themes_path: tests/fixtures/themes
      rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule" && $MAINTENANCE_TASK == "renovate"'
          when: never
        - when: on_success

stages: [maintenance, validate, build, test]

.regular:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $MAINTENANCE_TASK == "renovate"'
      when: never
    - when: on_success

renovate-config:
  extends: .regular
  stage: validate
  tags: [fullstacks]
  image:
    name: renovate/renovate:44.148.4@sha256:2c7b118cb2d1b7137e63322efc0e1d3d96d5f6937ec1c35c3cd9b7de73a8ed29
    entrypoint: ['']
  script:
    - renovate-config-validator --strict --no-global renovate.json
    - renovate-config-validator --strict ci/renovate.cjs

component-tests:
  extends: .regular
  stage: validate
  image: alpine:3.24
  tags: [fullstacks]
  before_script:
    - apk add --no-cache bash jq yq ripgrep make zip
  script:
    - make test
    - mkdir -p test-providers
    - |
      printf 'Manifest-Version: 1.0\n\n' > test-providers/MANIFEST.MF
    - zip -j test-providers/test-resource.jar test-providers/MANIFEST.MF
  artifacts:
    paths: [test-providers/]

build-custom:
  extends: build-keycloak
  variables:
    KEYCLOAK_DB: dev-file
    KEYCLOAK_HEALTH: 'false'
    KEYCLOAK_METRICS: 'false'
    KEYCLOAK_FEATURES: scripts
    KEYCLOAK_FEATURES_DISABLED: impersonation
    KEYCLOAK_PROVIDERS_PATH: test-providers
    KEYCLOAK_IMAGE_TAG: $CI_COMMIT_SHA-custom

customization-test:
  extends: .regular
  stage: test
  tags: [fullstacks]
  image:
    name: $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHA-custom
    entrypoint: ['']
  script:
    - sh scripts/check-customization.sh

smoke-test:
  extends: .regular
  stage: test
  image: alpine:3.24
  tags: [fullstacks]
  variables:
    POSTGRES_DB: keycloak
    POSTGRES_USER: keycloak
    POSTGRES_PASSWORD: integration-only
    KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
    KC_DB_USERNAME: keycloak
    KC_DB_PASSWORD: integration-only
    KC_HTTP_ENABLED: 'true'
    KC_HTTP_MANAGEMENT_SCHEME: http
    KC_HOSTNAME: http://keycloak:8080
    KEYCLOAK_URL: http://keycloak:8080
    MANAGEMENT_URL: http://keycloak:9000
  services:
    - name: postgres:17.7-alpine
      alias: postgres
    - name: $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHA
      alias: keycloak
      command: [start, --optimized]
  before_script:
    - apk add --no-cache bash curl jq ripgrep
  script:
    - bash scripts/smoke-test.sh
