include:
  - local: templates/build-keycloak/template.yml
    inputs:
      image_name: $CI_REGISTRY_IMAGE/test
      image_tag: $CI_COMMIT_SHA
      themes_path: tests/fixtures/themes

stages: [validate, build, test]

component-tests:
  stage: validate
  image: alpine:3.24
  tags: [fullstacks]
  before_script:
    - apk add --no-cache bash jq yq ripgrep make
  script:
    - make test

smoke-test:
  stage: test
  image: alpine:3.24
  tags: [fullstacks]
  variables:
    POSTGRES_DB: keycloak
    POSTGRES_USER: keycloak
    POSTGRES_PASSWORD: integration-only
    KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
    KC_DB_USERNAME: keycloak
    KC_DB_PASSWORD: integration-only
    KC_HTTP_ENABLED: 'true'
    KC_HTTP_MANAGEMENT_SCHEME: http
    KC_HOSTNAME: http://keycloak:8080
    KEYCLOAK_URL: http://keycloak:8080
    MANAGEMENT_URL: http://keycloak:9000
  services:
    - name: postgres:17.7-alpine
      alias: postgres
    - name: $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHA
      alias: keycloak
      command: [start, --optimized]
  before_script:
    - apk add --no-cache bash curl jq ripgrep
  script:
    - bash scripts/smoke-test.sh
