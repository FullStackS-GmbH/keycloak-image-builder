include:
  - local: ci/renovate.yaml
  - local: templates/build-keycloak/template.yml
    inputs:
      image_name: $CI_REGISTRY_IMAGE/test
      image_tag: $CI_COMMIT_SHA
      themes_path: tests/fixtures/themes
      rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule" && $MAINTENANCE_TASK == "renovate"'
          when: never
        - when: on_success

stages: [maintenance, validate, build, test]

.regular:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $MAINTENANCE_TASK == "renovate"'
      when: never
    - when: on_success

renovate-config:
  extends: .regular
  stage: validate
  tags: [fullstacks]
  image:
    name: renovate/renovate:44.148.4@sha256:2c7b118cb2d1b7137e63322efc0e1d3d96d5f6937ec1c35c3cd9b7de73a8ed29
    entrypoint: ['']
  script:
    - renovate-config-validator --strict --no-global renovate.json
    - renovate-config-validator --strict ci/renovate.cjs

component-tests:
  extends: .regular
  stage: validate
  image: alpine:3.24
  tags: [fullstacks]
  before_script:
    - apk add --no-cache bash jq yq ripgrep make
  script:
    - make test

smoke-test:
  extends: .regular
  stage: test
  image: alpine:3.24
  tags: [fullstacks]
  variables:
    POSTGRES_DB: keycloak
    POSTGRES_USER: keycloak
    POSTGRES_PASSWORD: integration-only
    KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
    KC_DB_USERNAME: keycloak
    KC_DB_PASSWORD: integration-only
    KC_HTTP_ENABLED: 'true'
    KC_HTTP_MANAGEMENT_SCHEME: http
    KC_HOSTNAME: http://keycloak:8080
    KEYCLOAK_URL: http://keycloak:8080
    MANAGEMENT_URL: http://keycloak:9000
  services:
    - name: postgres:17.7-alpine
      alias: postgres
    - name: $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHA
      alias: keycloak
      command: [start, --optimized]
  before_script:
    - apk add --no-cache bash curl jq ripgrep
  script:
    - bash scripts/smoke-test.sh
